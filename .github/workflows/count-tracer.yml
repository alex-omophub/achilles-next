name: Synthetic PostgreSQL count tracer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_calendar:
        description: Run the wider synthetic domain calendar (60-minute budget)
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    name: integration (${{ matrix.suite }})
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        suite: [compatibility, domain, measurement]
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.full_calendar && 60 || 30 }}
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASECONNECTOR_JAR_FOLDER: ${{ github.workspace }}/.local/jdbc
      ACHILLES_NEXT_FIXTURE_STATE: ${{ github.workspace }}/.local/postgresql
      R_LIBS: ${{ github.workspace }}/.local/R-library
      TRACER_TEST_BUNDLES: ${{ github.workspace }}/.local/tracer-integration
      WEIGHTED_TEST_BUNDLES: ${{ github.workspace }}/.local/weighted-integration
      MEASUREMENT_TEST_BUNDLES: ${{ github.workspace }}/.local/measurement-integration
      OBSERVATION_TEST_BUNDLES: ${{ github.workspace }}/.local/observation-integration
      ACHILLES_NEXT_VIEWER_TEST_LIBRARY: ${{ github.workspace }}/.local/R-library
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: matrix.suite == 'compatibility'
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            packages/tracer/package-lock.json
      - uses: actions/setup-java@v6
        id: java
        with:
          distribution: temurin
          java-version: '11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2.3'
          use-public-rspm: true
      - name: Check portable Gregorian request dates
        if: matrix.suite == 'compatibility'
        run: Rscript --vanilla tests/tracer/request.R
      - name: Register the selected JDK with R
        run: |
          # rJava's JRI component links against R's system development libraries.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre2-dev liblzma-dev libbz2-dev zlib1g-dev libicu-dev libtirpc-dev
          # setup-java changes JAVA_HOME, but R keeps its build-time JNI paths.
          sudo env JAVA_HOME="$JAVA_HOME" "$(command -v R)" CMD javareconf
      - name: Fingerprint R dependency declarations
        run: |
          mkdir -p .local
          Rscript --vanilla tools/ci/r-dependency-spec.R DESCRIPTION .local/r-dependency-spec.txt
      - name: Restore compiled R dependencies
        id: r-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.R_LIBS }}
          # Exact matches only: rJava embeds JDK paths in its compiled library.
          # Package prose and unrelated workflow edits do not invalidate this cache.
          # Bump v2 only to refresh compiled dependencies without changing inputs.
          key: tracer-r-deps-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu22.04-temurin-${{ steps.java.outputs.version }}-${{ hashFiles('.local/r-dependency-spec.txt', 'tools/ci/install-r-dependencies.R', 'tests/tracer/runtime-lock.json') }}
      - name: Restore pinned JDBC driver
        uses: actions/cache@v5
        with:
          path: ${{ env.DATABASECONNECTOR_JAR_FOLDER }}
          key: tracer-jdbc-v1-${{ hashFiles('tests/tracer/runtime-lock.json') }}
      - name: Install R dependencies on a cache miss
        if: steps.r-deps-cache.outputs.cache-hit != 'true'
        run: Rscript --vanilla tools/ci/install-r-dependencies.R
      - name: Verify R dependencies, JNI and JDBC on every run
        shell: Rscript {0}
        run: |
          .libPaths(c(Sys.getenv('R_LIBS'), .libPaths()))
          required <- c('remotes', 'jsonlite', 'digest', 'httpuv', 'DatabaseConnector')
          stopifnot(all(vapply(required, requireNamespace, logical(1), quietly=TRUE)))
          lock <- jsonlite::fromJSON('tests/tracer/runtime-lock.json')
          stopifnot(identical(as.character(getRversion()), lock$r))
          stopifnot(identical(as.character(utils::packageVersion('DatabaseConnector')), lock$DatabaseConnector))
          rJava::.jinit()
          javaVersion <- rJava::.jcall('java/lang/System', 'S', 'getProperty', 'java.version')
          stopifnot(startsWith(javaVersion, '11.'))
          cat('R JNI smoke check passed with Java', javaVersion, '\n')
          dir.create(Sys.getenv('DATABASECONNECTOR_JAR_FOLDER'), recursive=TRUE, showWarnings=FALSE)
          driver <- file.path(Sys.getenv('DATABASECONNECTOR_JAR_FOLDER'), lock$jdbc_file)
          if (!file.exists(driver)) DatabaseConnector::downloadJdbcDrivers('postgresql')
          stopifnot(identical(digest::digest(file=driver,algo='sha256'),lock$jdbc_sha256))
      - name: Save verified R dependencies before installing AchillesNext
        if: steps.r-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.R_LIBS }}
          key: ${{ steps.r-deps-cache.outputs.cache-primary-key }}
      - name: Use the pinned psql client with the pinned server
        run: |
          mkdir -p .local/bin
          chmod 700 .local
          docker pull postgres:17.10
          docker run --detach --rm --name achillesnext-psql-client --network host \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --entrypoint sleep postgres:17.10 infinity
          cp tools/ci/psql .local/bin/psql
          chmod +x .local/bin/psql
          echo "$GITHUB_WORKSPACE/.local/bin" >> "$GITHUB_PATH"
          printf '127.0.0.1:5432:*:postgres:synthetic-ci-only\n' > .local/admin.pgpass
          chmod 600 .local/admin.pgpass
      - name: Create only the isolated synthetic reference fixtures
        env:
          PGPASSFILE: ${{ github.workspace }}/.local/admin.pgpass
        run: python3 tools/postgresql_fixtures.py setup --host 127.0.0.1 --admin-user postgres
      - name: Rebuild and verify the shipped viewer before R installation
        if: matrix.suite == 'compatibility'
        run: |
          npm ci --prefix packages/tracer --ignore-scripts --no-audit --no-fund
          npm run package-viewer --prefix packages/tracer
          python3 tools/check_viewer_assets.py
          git diff --exit-code -- inst/viewer inst/validation
      - name: Install contracts dependencies before generator validation
        if: matrix.suite == 'compatibility'
        run: npm ci --prefix packages/contracts --ignore-scripts --no-audit --no-fund
      - name: Install the current R package
        run: R CMD INSTALL --library="$R_LIBS" .
      - name: Verify native contracts and core publication
        if: matrix.suite == 'compatibility'
        run: |
          Rscript --vanilla tests/tracer/native-validation.R .
          python3 tools/check_schema_subset.py
          Rscript --vanilla tests/tracer/saved-selection.R
          Rscript --vanilla tests/tracer/saved-transport.R
          Rscript --vanilla tests/tracer/result-validation-offline.R
          Rscript --vanilla tests/tracer/baseline-reader-once.R
          Rscript --vanilla tests/tracer/result-wire.R "$RUNNER_TEMP/v2-corpus.json"
          node packages/contracts/tools/validate-v2-corpus.mjs "$RUNNER_TEMP/v2-corpus.json"
          Rscript --vanilla tests/tracer/result-store.R tools/tracer_fixture_config.R
          PGPASSFILE="$GITHUB_WORKSPACE/.local/admin.pgpass" python3 tools/test_result_serving.py --state .local/postgresql --config tools/tracer_fixture_config.R --output-dir "$RUNNER_TEMP/result-export" --admin-host 127.0.0.1 --admin-user postgres
      - name: Verify implementation and recovery
        if: matrix.suite == 'compatibility'
        run: |
          Rscript --vanilla tests/tracer/implementation-identity.R
          Rscript --vanilla tests/tracer/recovery-offline.R
          Rscript --vanilla tests/tracer/run-ledger-offline.R
          Rscript --vanilla tests/tracer/recovery.R tools/tracer_fixture_config.R "$RUNNER_TEMP/recovery"
      - name: Verify fixture publication and execution ledger
        if: matrix.suite == 'compatibility'
        run: |
          Rscript --vanilla tests/tracer/publication.R tools/tracer_fixture_config.R "$RUNNER_TEMP/publication"
          Rscript --vanilla tests/tracer/run-ledger.R tools/tracer_fixture_config.R "$RUNNER_TEMP/execution-ledger"
      - name: Build count, observation and measurement tracer bundles
        if: matrix.suite == 'compatibility'
        run: |
          Rscript tests/tracer/postgresql.R tools/tracer_fixture_config.R "$TRACER_TEST_BUNDLES"
          Rscript tests/tracer/observation.R tools/tracer_fixture_config.R "$OBSERVATION_TEST_BUNDLES"
          Rscript --vanilla tests/tracer/quantile-request.R
          Rscript tests/tracer/measurement.R tools/tracer_fixture_config.R "$MEASUREMENT_TEST_BUNDLES"
          ACHILLES_NEXT_TEST_NUMERIC_STRATEGY=weighted Rscript tests/tracer/measurement.R tools/tracer_fixture_config.R "$WEIGHTED_TEST_BUNDLES"
          python3 tools/benchmark/weighted_quantiles.py --config tools/tracer_fixture_config.R --output-dir "$RUNNER_TEMP/weighted-quantile-parity"
      - name: Check core batch planning and private staging
        if: matrix.suite == 'compatibility'
        run: |
          Rscript --vanilla tests/tracer/analysis-definitions.R
          Rscript --vanilla tests/tracer/registered-profile-offline.R
          Rscript --vanilla tests/tracer/source-store-offline.R
          Rscript --vanilla tests/tracer/measurement-baseline-offline.R
          Rscript --vanilla tests/tracer/refresh-contract-offline.R
          Rscript --vanilla tests/tracer/refresh-execution-offline.R
          Rscript --vanilla tests/tracer/core-metadata-offline.R
          Rscript --vanilla tests/tracer/persistence-offline.R "$RUNNER_TEMP/v2-corpus.json"
          Rscript --vanilla tests/tracer/batch-plan.R
          PGPASSFILE="$GITHUB_WORKSPACE/.local/admin.pgpass" python3 tools/test_result_serving.py --test-script registered-profile --state .local/postgresql --config tools/tracer_fixture_config.R --output-dir "$RUNNER_TEMP/registered-profile" --admin-host 127.0.0.1 --admin-user postgres
          PGPASSFILE="$GITHUB_WORKSPACE/.local/admin.pgpass" python3 tools/test_result_serving.py --test-script refresh-contract --state .local/postgresql --config tools/tracer_fixture_config.R --output-dir "$RUNNER_TEMP/refresh-contract" --admin-host 127.0.0.1 --admin-user postgres
          python3 tools/benchmark/batch_primitives.py --config tools/tracer_fixture_config.R --output-dir "$RUNNER_TEMP/batch-primitives" --trials 1
      - name: Verify persisted population and observation baseline
        if: matrix.suite == 'domain'
        run: python3 tools/test_population_baseline.py --config tools/tracer_fixture_config.R --output-dir "$RUNNER_TEMP/population-baseline"
      - name: Verify eight-domain generation and saved concept/time selection
        if: matrix.suite == 'domain'
        env:
          COMPACT_DOMAIN_CALENDAR: ${{ inputs.full_calendar && '0' || '1' }}
        run: |
          Rscript --vanilla tests/tracer/domain-review-offline.R
          calendar_args=()
          if [ "$COMPACT_DOMAIN_CALENDAR" = 1 ]; then calendar_args+=(--compact-calendar); fi
          python3 tools/test_domain_baseline.py "${calendar_args[@]}" --config tools/tracer_fixture_config.R --output-dir "$RUNNER_TEMP/domain-baseline"
      - name: Verify whole-source measurements and exact summary parity
        if: matrix.suite == 'measurement'
        run: python3 tools/test_measurement_baseline.py --config tools/tracer_fixture_config.R --output-dir "$RUNNER_TEMP/measurement-baseline"
      - name: Validate core refresh, metadata, projection, export and serving reads
        if: matrix.suite == 'measurement'
        run: PGPASSFILE="$GITHUB_WORKSPACE/.local/admin.pgpass" python3 tools/test_core_characterization.py --full-matrix --with-publication --state .local/postgresql --config tools/tracer_fixture_config.R --output-dir "$RUNNER_TEMP/core-characterization" --admin-host 127.0.0.1 --admin-user postgres
      - name: Prove full refresh recomputation and prior publication preservation
        if: matrix.suite == 'measurement'
        run: PGPASSFILE="$GITHUB_WORKSPACE/.local/admin.pgpass" python3 tools/test_characterization_refresh.py --state .local/postgresql --config tools/tracer_fixture_config.R --output-dir "$RUNNER_TEMP/full-refresh" --admin-host 127.0.0.1 --admin-user postgres
      - name: Prove concurrent snapshots, connection loss and pinned promotion reads
        if: matrix.suite == 'measurement'
        run: PGPASSFILE="$GITHUB_WORKSPACE/.local/admin.pgpass" python3 tools/test_refresh_operations.py --state .local/postgresql --config tools/tracer_fixture_config.R --output-dir "$RUNNER_TEMP/refresh-operations" --admin-host 127.0.0.1 --admin-user postgres
      - name: Validate every generated bundle against the frozen contracts
        if: matrix.suite == 'compatibility'
        run: |
          npm run check --prefix packages/contracts
          for bundle in "$TRACER_TEST_BUNDLES"/* "$OBSERVATION_TEST_BUNDLES"/* "$MEASUREMENT_TEST_BUNDLES"/* "$WEIGHTED_TEST_BUNDLES"/*; do
            node packages/contracts/tools/validate.mjs "$bundle"
          done
      - name: Check generated results and the installed local viewer
        if: matrix.suite == 'compatibility'
        run: |
          PUBLICATION_TEST_BUNDLES="$RUNNER_TEMP/publication" npm test --prefix packages/tracer
          export PUBLICATION_TEST_BUNDLES="$RUNNER_TEMP/publication"
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Stop the persistent psql client
        if: always()
        run: docker rm -f achillesnext-psql-client || true
  # Keep the existing required check name; all distinct suites must pass.
  tracer:
    if: always()
    needs: integration
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    steps:
      - name: Require every integration suite to succeed
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$INTEGRATION_RESULT" = success
