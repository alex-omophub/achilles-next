name: Synthetic PostgreSQL count tracer
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tracer:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASECONNECTOR_JAR_FOLDER: ${{ github.workspace }}/.local/jdbc
      ACHILLES_NEXT_FIXTURE_STATE: ${{ github.workspace }}/.local/postgresql
      R_LIBS: ${{ github.workspace }}/.local/R-library
      TRACER_TEST_BUNDLES: ${{ github.workspace }}/.local/tracer-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2.3'
          use-public-rspm: true
      - name: Register the selected JDK with R
        run: |
          # rJava's JRI component links against R's system development libraries.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre2-dev liblzma-dev libbz2-dev zlib1g-dev libicu-dev libtirpc-dev
          # setup-java changes JAVA_HOME, but R keeps its build-time JNI paths.
          sudo env JAVA_HOME="$JAVA_HOME" "$(command -v R)" CMD javareconf
      - name: Install R development dependencies and pinned JDBC driver
        shell: Rscript {0}
        run: |
          dir.create(Sys.getenv('R_LIBS'), recursive=TRUE)
          .libPaths(c(Sys.getenv('R_LIBS'), .libPaths()))
          install.packages(c('remotes', 'jsonlite', 'digest'), repos='https://cloud.r-project.org')
          remotes::install_version('DatabaseConnector', version='6.3.2', upgrade='never', repos='https://cloud.r-project.org')
          stopifnot(requireNamespace('DatabaseConnector', quietly=TRUE))
          rJava::.jinit()
          javaVersion <- rJava::.jcall('java/lang/System', 'S', 'getProperty', 'java.version')
          stopifnot(startsWith(javaVersion, '11.'))
          cat('R JNI smoke check passed with Java', javaVersion, '\n')
          dir.create(Sys.getenv('DATABASECONNECTOR_JAR_FOLDER'), recursive=TRUE)
          DatabaseConnector::downloadJdbcDrivers('postgresql')
          lock <- jsonlite::fromJSON('tests/tracer/runtime-lock.json')
          stopifnot(identical(digest::digest(file=file.path(Sys.getenv('DATABASECONNECTOR_JAR_FOLDER'),lock$jdbc_file),algo='sha256'),lock$jdbc_sha256))
      - name: Use the pinned psql client with the pinned server
        run: |
          mkdir -p .local/bin
          chmod 700 .local
          docker pull postgres:17.10
          cat > .local/bin/psql <<'PSQL'
          #!/bin/sh
          exec docker run --rm -i --network host \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --env PGCLIENTENCODING --env PGOPTIONS --env PGPASSFILE --env PGSERVICEFILE \
            postgres:17.10 psql "$@"
          PSQL
          chmod +x .local/bin/psql
          echo "$GITHUB_WORKSPACE/.local/bin" >> "$GITHUB_PATH"
          printf '127.0.0.1:5432:*:postgres:synthetic-ci-only\n' > .local/admin.pgpass
          chmod 600 .local/admin.pgpass
      - name: Create only the isolated synthetic reference fixtures
        env:
          PGPASSFILE: ${{ github.workspace }}/.local/admin.pgpass
        run: python3 tools/postgresql_fixtures.py setup --host 127.0.0.1 --admin-user postgres
      - name: Install package and build real count bundles
        run: |
          R CMD INSTALL --library="$R_LIBS" .
          Rscript tests/tracer/postgresql.R tools/tracer_fixture_config.R "$TRACER_TEST_BUNDLES"
      - name: Validate every generated bundle against the frozen contracts
        run: |
          npm ci --prefix packages/contracts --ignore-scripts --no-audit --no-fund
          npm run check --prefix packages/contracts
          for bundle in "$TRACER_TEST_BUNDLES"/*; do
            node packages/contracts/tools/validate.mjs "$bundle"
          done
      - name: Build React and check the generated results through its file provider
        run: |
          npm ci --prefix packages/tracer --ignore-scripts --no-audit --no-fund
          npm run check --prefix packages/tracer
          python3 -m unittest discover -s tests -p 'test_*.py'
